# End-to-end check (docs/e2e/README.md): throwaway MongoDB, PostgreSQL and a mail catcher, loaded from
# a production export. Every port is bound to loopback, and nothing here talks to dev or production.
#
#   docker compose -f e2e/docker-compose.yml up -d --wait
#   docker compose -f e2e/docker-compose.yml down -v      # removes the data too
name: ehub-e2e

services:
  mongo:
    image: "mongo:8.0.32" # same as dev
    # A single-node replica set (transactions need one). The member is named as the host sees it, so
    # backends running on the host can connect with replicaSet=rs0.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27117"]
    ports:
      - "127.0.0.1:27117:27117"
    healthcheck:
      # Starts the replica set on the first check, then reports whether it's up
      test:
        - CMD
        - mongosh
        - --port
        - "27117"
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27117' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: "postgis/postgis:18-3.6" # same as dev
    environment:
      POSTGRES_DB: ehub_e2e
      POSTGRES_USER: ehub_e2e
      POSTGRES_PASSWORD: ehub_e2e
    ports:
      - "127.0.0.1:55432:5432"
    # As in dev: the Knex migrations alone decide which extensions exist
    entrypoint: >
      sh -c "rm -f /docker-entrypoint-initdb.d/10_postgis.sh && exec docker-entrypoint.sh postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ehub_e2e -d ehub_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Catches every email the backends send (password resets, alerts), so none reaches a real person.
  # Its API (http://localhost:8125/api/v1/messages) lets the tests read reset links.
  mailpit:
    image: "axllent/mailpit:v1.21.8"
    ports:
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"
