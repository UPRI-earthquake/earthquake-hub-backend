name: Publish development image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

# Publishing must never run on a PR or on failed CI.
permissions: {}

concurrency:
  group: publish-dev
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to GHCR
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'dev' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/upri-earthquake/earthquake-hub-backend
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the exact commit validated by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm the validated commit is still dev HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$head_sha" == "$SOURCE_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded CI result for $SOURCE_SHA"
          fi

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish commit-specific image
        id: build
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Move dev tag only if this is still dev HEAD
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$head_sha" != "$SOURCE_SHA" ]]; then
            echo "Newer dev commit detected; preserving dev tag."
            echo "Published immutable candidate: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:dev" "${IMAGE}@${DIGEST}"
          echo "Published ${IMAGE}:sha-${SOURCE_SHA} and updated ${IMAGE}:dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
