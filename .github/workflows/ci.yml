name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate isolated CI-only web push keys
        run: |
          node -e 'const fs = require("fs"); const k = require("web-push").generateVAPIDKeys(); fs.appendFileSync(process.env.GITHUB_ENV, "PUBLIC_VAPID_KEY=" + k.publicKey + "\nPRIVATE_VAPID_KEY=" + k.privateKey + "\nWEB_PUSH_CONTACT=mailto:ci@example.com\n");'

      - name: Run Jest tests
        env:
          NODE_ENV: test
          CI: 'true'
        run: npm test -- --runInBand --watch=false

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --file Dockerfile --tag earthquake-hub-backend:ci .
