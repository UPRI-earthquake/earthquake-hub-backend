name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Syntax-check release preflight
        run: |
          bash -n .github/scripts/verify-promotion.sh
          bash -n .github/scripts/auto-staging-preflight.sh

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        env:
          NODE_ENV: test
          CI: 'true'
        run: npm test -- --runInBand --watch=false

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --file Dockerfile --tag earthquake-hub-backend:ci .

  auto-staging-preflight:
    name: Staging image preflight (read-only)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: [validate, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      IMAGE: ghcr.io/upri-earthquake/earthquake-hub-backend
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact staging merge with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR to inspect the existing image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate and verify promotion eligibility (no writes)
        run: bash .github/scripts/auto-staging-preflight.sh
