name: Prepare versioned release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA of a successful dev CI build
        required: true
        type: string
      expected_digest:
        description: Exact sha256 digest of the existing GHCR image
        required: true
        type: string
      release_version:
        description: New semantic version (for example v1.0.0)
        required: true
        type: string
      dry_run:
        description: Verify eligibility without writing to GHCR or GitHub Releases
        required: true
        type: boolean
        default: true
      confirmation:
        description: For live operation enter APPROVE-VERSION
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and create versioned release
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ inputs.dry_run && 'read' || 'write' }}
      packages: ${{ inputs.dry_run && 'read' || 'write' }}
    env:
      IMAGE: ghcr.io/upri-earthquake/earthquake-hub-backend
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
      PROMOTION_MODE: release
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted workflow code and full branch history
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR for registry verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate, CI provenance, digest, and branch eligibility
        run: bash .github/scripts/verify-promotion.sh

      - name: Create write-once version tag from verified digest
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${RELEASE_VERSION}" "${IMAGE}@${EXPECTED_DIGEST}"
          result="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}')"
          [[ "$result" == "$EXPECTED_DIGEST" ]] || { echo 'Promoted digest differs from source'; exit 1; }
          echo "Verified promoted image: ${IMAGE}@${result}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release for exact source commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" --target "$SOURCE_SHA" --title "$RELEASE_VERSION" --notes "Approved Earthquake Hub image: ${IMAGE}@${EXPECTED_DIGEST}

Source commit: ${SOURCE_SHA}
Previously verified on staging using the same image digest.
Frontend and Backend companion digest must be recorded separately in the release manifest."

