name: Promote staging image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA of a successful dev CI build
        required: true
        type: string
      expected_digest:
        description: Exact sha256 digest of the existing GHCR image
        required: true
        type: string
      dry_run:
        description: Verify eligibility without writing to GHCR or GitHub Releases
        required: true
        type: boolean
        default: true
      confirmation:
        description: For live operation enter PROMOTE-STAGING
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and tag staging digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/upri-earthquake/earthquake-hub-backend
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
      PROMOTION_MODE: staging
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted workflow code and full branch history
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR for registry verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate, CI provenance, digest, and branch eligibility
        run: bash .github/scripts/verify-promotion.sh

      - name: Promote verified digest to staging
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:staging" "${IMAGE}@${EXPECTED_DIGEST}"
          result="$(docker buildx imagetools inspect "${IMAGE}:staging" --format '{{.Manifest.Digest}}')"
          [[ "$result" == "$EXPECTED_DIGEST" ]] || { echo 'Promoted digest differs from source'; exit 1; }
          echo "Verified promoted image: ${IMAGE}@${result}" >> "$GITHUB_STEP_SUMMARY"

